<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaBlu Web - 智能水控系统</title>
    <style>
        :root {
            --primary: #8a2be2;
            --primary-dark: #7b1fa2;
            --success: #4caf50;
            --danger: #f44336;
            --warning: #ff9800;
            --info: #2196f3;
            --light: #f8f9fa;
            --dark: #343a40;
            --gray: #6c757d;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--light);
            border-bottom: 1px solid #eee;
        }
        
        .status-item {
            text-align: center;
        }
        
        .status-label {
            font-size: 0.8rem;
            color: var(--gray);
        }
        
        .status-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--dark);
        }
        
        .connected {
            color: var(--success);
        }
        
        .disconnected {
            color: var(--danger);
        }
        
        .main-content {
            padding: 20px;
        }
        
        .device-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .device-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .device-id {
            font-family: monospace;
            background: #e9ecef;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        
        .control-panel {
            text-align: center;
            margin: 30px 0;
        }
        
        .timer-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
            font-family: monospace;
        }
        
        .cost-display {
            font-size: 1.5rem;
            color: var(--gray);
            margin-bottom: 30px;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            outline: none;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.3);
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn:disabled {
            background: var(--gray);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .history-section {
            margin-top: 30px;
        }
        
        .history-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--dark);
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        
        .history-list {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .history-time {
            font-weight: bold;
        }
        
        .history-duration {
            color: var(--gray);
        }
        
        .history-cost {
            font-weight: bold;
            color: var(--primary);
        }
        
        .footer {
            text-align: center;
            padding: 15px;
            background: var(--light);
            color: var(--gray);
            font-size: 0.8rem;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 5px;
            color: white;
            z-index: 1000;
            transform: translateX(150%);
            transition: transform 0.3s;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.success {
            background: var(--success);
        }
        
        .notification.error {
            background: var(--danger);
        }
        
        .notification.info {
            background: var(--info);
        }
        
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .container {
                border-radius: 10px;
            }
            
            .timer-display {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AquaBlu Web 水控系统</h1>
            <p>智能蓝牙用水控制 - FOSS版本</p>
        </div>
        
        <div class="status-bar">
            <div class="status-item">
                <div class="status-label">连接状态</div>
                <div class="status-value" id="connectionStatus" class="disconnected">未连接</div>
            </div>
            <div class="status-item">
                <div class="status-label">设备ID</div>
                <div class="status-value" id="deviceId">---</div>
            </div>
            <div class="status-item">
                <div class="status-label">当前状态</div>
                <div class="status-value" id="waterStatus">停止</div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="device-card">
                <div class="device-info">
                    <div>蓝牙设备</div>
                    <div class="device-id" id="deviceMac">未选择</div>
                </div>
                <button id="connectBtn" class="btn btn-primary" style="width: 100%; margin-top: 15px;">
                    连接水控器
                </button>
            </div>
            
            <div class="control-panel">
                <div class="timer-display" id="timerDisplay">00:00</div>
                <div class="cost-display" id="costDisplay">费用: 0.00 元</div>
                
                <button id="startBtn" class="btn btn-success" disabled>
                    开始用水
                </button>
                <button id="stopBtn" class="btn btn-danger" disabled>
                    结束使用
                </button>
            </div>
            
            <div class="history-section">
                <div class="history-title">用水记录</div>
                <div class="history-list" id="historyList">
                    <!-- 历史记录将通过JavaScript动态添加 -->
                    <div class="history-item">
                        <div class="history-time">暂无记录</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            AquaBlu FOSS Project · 基于Web Bluetooth API · 开源版本 v1.0
        </div>
    </div>
    
    <div class="notification" id="notification"></div>

    <script>
        // 应用状态管理
        const state = {
            isConnected: false,
            isRunning: false,
            startTime: null,
            currentTimer: 0,
            timerInterval: null,
            device: null,
            server: null,
            characteristic: null,
            rate: 0.05, // 元/秒，示例费率
            history: JSON.parse(localStorage.getItem('aquabluHistory')) || []
        };
        
        // DOM元素
        const connectionStatusEl = document.getElementById('connectionStatus');
        const deviceIdEl = document.getElementById('deviceId');
        const deviceMacEl = document.getElementById('deviceMac');
        const waterStatusEl = document.getElementById('waterStatus');
        const connectBtn = document.getElementById('connectBtn');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const timerDisplayEl = document.getElementById('timerDisplay');
        const costDisplayEl = document.getElementById('costDisplay');
        const historyListEl = document.getElementById('historyList');
        const notificationEl = document.getElementById('notification');
        
        // 蓝牙设备服务UUID（基于图片中的信息）
        const SERVICE_UUID = 0xFFE0;
        const CHARACTERISTIC_UUID = 0xFFE1;
        
        // 初始化
        function init() {
            updateUI();
            renderHistory();
            
            // 检查浏览器是否支持Web Bluetooth API
            if (!navigator.bluetooth) {
                showNotification('您的浏览器不支持Web Bluetooth API', 'error');
                connectBtn.disabled = true;
                connectBtn.textContent = '浏览器不支持';
            }
            
            // 事件监听
            connectBtn.addEventListener('click', toggleConnection);
            startBtn.addEventListener('click', startWaterFlow);
            stopBtn.addEventListener('click', stopWaterFlow);
        }
        
        // 连接/断开蓝牙设备
        async function toggleConnection() {
            if (state.isConnected) {
                await disconnectDevice();
            } else {
                await connectDevice();
            }
        }
        
        // 连接设备
        async function connectDevice() {
            try {
                showNotification('正在搜索水控器设备...', 'info');
                
                // 请求蓝牙设备
                state.device = await navigator.bluetooth.requestDevice({
                    filters: [
                        { name: 'BT19S-T' }, // 根据图片中的设备名称
                        { services: [SERVICE_UUID] }
                    ],
                    optionalServices: [SERVICE_UUID]
                });
                
                // 监听设备断开事件
                state.device.addEventListener('gattserverdisconnected', onDisconnected);
                
                // 连接GATT服务器
                showNotification('正在连接设备...', 'info');
                const server = await state.device.gatt.connect();
                state.server = server;
                
                // 获取服务
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                // 获取特征
                state.characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                
                // 监听特征值变化
                state.characteristic.addEventListener('characteristicvaluechanged', 
                    onCharacteristicValueChanged);
                await state.characteristic.startNotifications();
                
                // 更新状态
                state.isConnected = true;
                deviceMacEl.textContent = state.device.id || 'BT19S-T';
                deviceIdEl.textContent = '010903170001040'; // 模拟设备ID
                
                showNotification('设备连接成功', 'success');
                updateUI();
                
            } catch (error) {
                console.error('连接失败:', error);
                showNotification('连接失败: ' + error.message, 'error');
            }
        }
        
        // 断开设备连接
        async function disconnectDevice() {
            if (state.device && state.device.gatt.connected) {
                if (state.isRunning) {
                    await stopWaterFlow();
                }
                
                state.device.gatt.disconnect();
            }
            
            onDisconnected();
        }
        
        // 设备断开连接处理
        function onDisconnected() {
            state.isConnected = false;
            state.device = null;
            state.server = null;
            state.characteristic = null;
            
            if (state.isRunning) {
                stopTimer();
                state.isRunning = false;
            }
            
            showNotification('设备已断开', 'info');
            updateUI();
        }
        
        // 特征值变化处理
        function onCharacteristicValueChanged(event) {
            // 这里处理从设备接收到的数据
            const value = event.target.value;
            console.log('收到设备数据:', value);
            
            // 在实际应用中，这里会解析设备发送的状态数据
            // 例如水阀状态、用水量等
        }
        
        // 开始用水
        async function startWaterFlow() {
            if (!state.isConnected) return;
            
            try {
                // 发送开始指令到设备
                // 实际指令格式需要根据设备协议确定
                const startCommand = new Uint8Array([0x01]); // 示例指令
                await state.characteristic.writeValue(startCommand);
                
                state.isRunning = true;
                state.startTime = new Date();
                startTimer();
                
                showNotification('开始用水', 'success');
                updateUI();
                
            } catch (error) {
                console.error('启动失败:', error);
                showNotification('启动失败: ' + error.message, 'error');
            }
        }
        
        // 结束用水
        async function stopWaterFlow() {
            if (!state.isConnected || !state.isRunning) return;
            
            try {
                // 发送停止指令到设备
                const stopCommand = new Uint8Array([0x00]); // 示例指令
                await state.characteristic.writeValue(stopCommand);
                
                const endTime = new Date();
                const duration = state.currentTimer;
                const cost = calculateCost(duration);
                
                // 保存记录
                saveHistory(duration, cost);
                
                state.isRunning = false;
                stopTimer();
                
                showNotification(`用水结束，时长: ${formatTime(duration)}，费用: ${cost.toFixed(2)}元`, 'info');
                updateUI();
                
            } catch (error) {
                console.error('停止失败:', error);
                showNotification('停止失败: ' + error.message, 'error');
            }
        }
        
        // 计时器功能
        function startTimer() {
            state.currentTimer = 0;
            state.timerInterval = setInterval(() => {
                state.currentTimer++;
                updateTimerDisplay();
            }, 1000);
        }
        
        function stopTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            updateTimerDisplay();
        }
        
        function updateTimerDisplay() {
            timerDisplayEl.textContent = formatTime(state.currentTimer);
            costDisplayEl.textContent = `费用: ${calculateCost(state.currentTimer).toFixed(2)} 元`;
        }
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function calculateCost(seconds) {
            return seconds * state.rate;
        }
        
        // 保存历史记录
        function saveHistory(duration, cost) {
            const record = {
                id: Date.now(),
                date: new Date().toLocaleString(),
                duration: duration,
                cost: cost
            };
            
            state.history.unshift(record);
            if (state.history.length > 10) {
                state.history = state.history.slice(0, 10);
            }
            
            localStorage.setItem('aquabluHistory', JSON.stringify(state.history));
            renderHistory();
        }
        
        // 渲染历史记录
        function renderHistory() {
            if (state.history.length === 0) {
                historyListEl.innerHTML = '<div class="history-item"><div class="history-time">暂无记录</div></div>';
                return;
            }
            
            historyListEl.innerHTML = state.history.map(record => `
                <div class="history-item">
                    <div class="history-time">${record.date}</div>
                    <div class="history-duration">${formatTime(record.duration)}</div>
                    <div class="history-cost">${record.cost.toFixed(2)}元</div>
                </div>
            `).join('');
        }
        
        // 更新UI状态
        function updateUI() {
            // 连接状态
            connectionStatusEl.textContent = state.isConnected ? '已连接' : '未连接';
            connectionStatusEl.className = state.isConnected ? 'status-value connected' : 'status-value disconnected';
            
            // 水流状态
            waterStatusEl.textContent = state.isRunning ? '运行中' : '停止';
            waterStatusEl.style.color = state.isRunning ? 'var(--success)' : 'var(--danger)';
            
            // 按钮状态
            connectBtn.textContent = state.isConnected ? '断开连接' : '连接水控器';
            connectBtn.className = state.isConnected ? 'btn btn-danger' : 'btn btn-primary';
            
            startBtn.disabled = !state.isConnected || state.isRunning;
            stopBtn.disabled = !state.isConnected || !state.isRunning;
            
            // 设备信息显示
            if (state.isConnected) {
                deviceIdEl.textContent = '010903170001040';
                deviceMacEl.textContent = state.device?.id || 'BT19S-T';
            } else {
                deviceIdEl.textContent = '---';
                deviceMacEl.textContent = '未选择';
            }
        }
        
        // 显示通知
        function showNotification(message, type = 'info') {
            notificationEl.textContent = message;
            notificationEl.className = `notification ${type}`;
            notificationEl.classList.add('show');
            
            setTimeout(() => {
                notificationEl.classList.remove('show');
            }, 3000);
        }
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
